version: 1

config:
  profiles:
    - name: Personal
      slug: personal
      description: "Everything Mires owns: the full skill catalog, both subagents, and every rule."
      using:
        mcps:
          - context7
        skills:
          - mires
          - mires-python
          - mires-python-django
          - mires-python-langchain
          - mires-react
          - mires-next
          - mires-typescript
        subagents:
          - explorer
          - planner
        rules:
          - no-secrets
          - commit-style
        hooks:
          - validate-state

    - name: Tenant Evaluation
      slug: tenant-evaluation
      description: "Django backend work: the core skill plus the Django and Python domains."
      using:
        mcps:
          - context7
        skills:
          - mires
          - mires-python
          - mires-python-django
        subagents:
          - explorer
          - planner
        rules:
          - no-secrets

secrets:
  - name: Context7 API Key
    slug: context7-api-key
    description: "Environment-backed credential for authenticated Context7 access."
    source:
      env: CONTEXT7_API_KEY

mcps:
  - name: Context7
    slug: context7
    description: "Current library, framework, and SDK documentation instead of stale training data."
    secrets:
      - secret: context7-api-key
        env: CONTEXT7_API_KEY
        targets:
          - codex
          - claude
          - opencode

# Every public skill is a self-contained instruction package. Its complete
# guidance lives in SKILL.md; relationships point to other declared skill slugs.
skills:
  - name: Mires
    slug: mires
    visibility: public
    description: "Macwdo's personal engineering preferences, delegation model, and the language-agnostic conventions, testing, review, and OpenSpec rules."

  - name: Mires Python
    slug: mires-python
    visibility: public
    description: "Typed Python with uv, Ruff, ty, modules, services, FastAPI, SQLAlchemy, Postgres, Celery, configuration, and tests."

  - name: Mires Python Django
    slug: mires-python-django
    visibility: public
    description: "Typed Django and DRF with uv, Ruff, ty, models, services, selectors, APIs, security, testing, and operations."

  - name: Mires Python LangChain
    slug: mires-python-langchain
    visibility: public
    description: "Typed LangChain, LangGraph, Deep Agents, LLM, loader, retrieval, persistence, and agent testing standards."

  - name: Mires React
    slug: mires-react
    visibility: public
    description: "React component composition, state ownership, forms, accessibility, performance, security, and testing standards."

  - name: Mires Next
    slug: mires-next
    visibility: public
    description: "Next.js App Router, Server and Client Component, data fetching, caching, mutation, security, and deployment standards."

  - name: Mires TypeScript
    slug: mires-typescript
    visibility: public
    description: "TypeScript type ownership, shared contracts, and API response typing across frontend and Node codebases."

subagents:
  - name: Explorer
    slug: explorer
    description: "Inspect a repository, map relevant surfaces, and report existing patterns without modifying files."

  - name: Planner
    slug: planner
    description: "Clarify ambiguous requests, break work into steps, and produce decision-ready implementation plans."

rules:
  - name: No Secrets
    slug: no-secrets
    description: "Never commit secrets, tokens, or private environment values into tracked assets."

  - name: Commit Style
    slug: commit-style
    description: "Short imperative commit subjects scoped to a single intent."

hooks:
  - name: Validate State
    slug: validate-state
    description: "Re-run catalog validation after an edit touches state.yml or a catalog directory."
