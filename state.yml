version: 1

config:
  profiles:
    - name: Personal
      slug: personal
      description: "Everything Mires owns: the full skill catalog, both subagents, and every rule."
      using:
        mcps:
          - context7
        skills:
          - mires
          - mires-python
          - mires-django
          - mires-react
          - mires-typescript
        subagents:
          - explorer
          - planner
        rules:
          - no-secrets
          - commit-style
        hooks:
          - validate-state

    - name: Tenant Evaluation
      slug: tenant-evaluation
      description: "Django backend work: the core skill plus the Django and Python domains."
      using:
        mcps:
          - context7
        skills:
          - mires
          - mires-python
          - mires-django
        subagents:
          - explorer
          - planner
        rules:
          - no-secrets

mcps:
  - name: Context7
    slug: context7
    description: "Current library, framework, and SDK documentation instead of stale training data."

# Skills are aggregated by domain. Per-topic guidance lives inside a skill as
# references/<topic>/rules.md plus its focused reference documents.
skills:
  - name: Mires
    slug: mires
    visibility: public
    description: "Macwdo's personal engineering preferences, delegation model, and the language-agnostic conventions, testing, review, and OpenSpec rules."

  - name: Mires Python
    slug: mires-python
    visibility: public
    description: "Python backend standards covering modules, service layers, FastAPI, SQLAlchemy, Postgres, Celery, and LangGraph."

  - name: Mires Django
    slug: mires-django
    visibility: public
    description: "Opinionated Django and DRF standards from an executable Markdown handbook, plus the condensed Django implementation rules."

  - name: Mires React
    slug: mires-react
    visibility: public
    description: "Opinionated React and Next.js standards from an executable Markdown handbook, plus the condensed React, Next.js, and frontend rules."

  - name: Mires TypeScript
    slug: mires-typescript
    visibility: public
    description: "TypeScript type ownership, shared contracts, and API response typing across frontend and Node codebases."

subagents:
  - name: Explorer
    slug: explorer
    description: "Inspect a repository, map relevant surfaces, and report existing patterns without modifying files."

  - name: Planner
    slug: planner
    description: "Clarify ambiguous requests, break work into steps, and produce decision-ready implementation plans."

rules:
  - name: No Secrets
    slug: no-secrets
    description: "Never commit secrets, tokens, or private environment values into tracked assets."

  - name: Commit Style
    slug: commit-style
    description: "Short imperative commit subjects scoped to a single intent."

hooks:
  - name: Validate State
    slug: validate-state
    description: "Re-run catalog validation after an edit touches state.yml or a catalog directory."
