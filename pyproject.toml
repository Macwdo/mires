[project]
name = "mires"
version = "0.1.0"
description = "Macwdo's personal engineering agent: a state-driven catalog of skills, subagents, rules, MCP servers, and hooks."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.scripts]
mires = "mires.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mires"]

# Ship the catalog inside the wheel so `uvx --from git+... mires install` works
# from any directory, without cloning the repository first.
[tool.hatch.build.targets.wheel.force-include]
"state.yml" = "mires/_catalog/state.yml"
"skills" = "mires/_catalog/skills"
"subagents" = "mires/_catalog/subagents"
"rules" = "mires/_catalog/rules"
"mcps" = "mires/_catalog/mcps"
"hooks" = "mires/_catalog/hooks"

[tool.pytest.ini_options]
testpaths = ["src/mires/tests"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
